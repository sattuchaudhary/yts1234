services:
  - type: web
    name: yts1234
    env: node
    buildCommand: npm install && npm run build && npx drizzle-kit push:pg
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: yts1234_db
          property: connectionString

    plan: free
    autoDeploy: false

databases:
  - name: yts1234_db
    plan: free
    ipAllowList: []
